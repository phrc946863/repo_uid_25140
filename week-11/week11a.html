<!DOCTYPE html>
<html>
<head>
<title>Username Validator</title>
<style>
body{
  font-family:Arial;
  background:rgb(78, 175, 91);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:rgb(239, 162, 162);
  padding:30px;
  border-radius:10px;
  text-align:center;
}
input{
  padding:10px;
  width:220px;
} 
button{
  padding:10px 20px;
  background:rgb(160, 78, 200);
  color:white;
  border:none;
  border-radius:5px;
}
</style>
</head>
<body>

<div class="box">
  <h2>Enter Username</h2>
  <input type="text" id="username" placeholder="Enter username">
  <br><br> 
  <button onclick="checkUsername()">Submit</button>
</div>

<script>
function checkUsername(){
  let username = document.getElementById("username").value;
  if(username.length < 5)
   alert("Username must be at least 5 characters long.");
  else
   alert("Username submitted successfully!");
}
</script>

</body>
</html>
