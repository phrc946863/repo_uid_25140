<!DOCTYPE html>
<html>
    <head>
        <style>
            table, th, td{
                border: 1px solid black;
                background-color: lightyellow;
            
            }
        </style>
        <Title>registration form</form></Title>
    </head>
    <body>
        <forms>
            <center>
                <table style="width: 50%" style="text-align: center;">
                <h1>registration form</h1>
                <tr>
                    <td><label id="fname">FullName</label></td>
                    <td><input type="name" for="fname" placeholder="name"></td>
                </tr>
                <tr>
                    <td><label id="email">Email</label></td>
                    <td><input type="email" for="email" placeholder="email"></td>
                </tr>
                <tr>
                    <td><label id="pnumber">PhoneNumber</label></td>
                    <td><input type="number" for="pnumber" placeholder="Number"></td>
                </tr> 
                <tr>
                    <td><label type="radio" id="Gender">Gender</label></td>
                    <td><input type="radio" name="Gender" for="Gender">Male 
                    <input type="radio" name="Gender" for="Gender">Female 
                    <input type="radio" name="Gender" for="Gender">Others
                    </td>
                </tr>
                <tr>
                    <td><label for="Course">Course Applying For</label></td>
                    <td>
                        <select name="Course" id="Course">
                            <OPtion value="B-tech">B-tech</OPtion>
                            <option value="B-arch">B-arch</option>
                            <option value="Degree">Degree</option>
                            <option value="Agriculture">Agriculture</option>

                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label type="radio" id="Hobbies">Hobbies</label></td>
                    <td><input type="radio" id="Hobbies" for="Hobbies">Music 
                    <input type="radio" id="Sports" for="Hobbies">Sports
                    <input type="radio" id="Reading" for="Hobbies">Reading
                    </td>
                </tr>   
                <tr>
                    <td><label for="dob">Date Of Birth</label></td>
                    <td>
                        <input type="date" id="dob" name="dob">
                    </td>
                </tr>
                <tr>
                   <td><label for="file" id="file">Uploding Certificates</label></td>
                   <td><input type="file" for="file"></td>
                </tr>
                <tr>
                    <td><label for="address">Address</label></td>
                    <td><textarea id="address" rows="11" name="address"></textarea></td>

                </tr>
                <tr aria-colspan="2">
                    <td style="text-align: center;" colspan="2">
                        <input type="submit" value="Submit Form">
                        <input type="reset" value="Reset Form">
                    </td>
                </tr>

            </table>
            </center>
            
        </forms>
        
       

    </body>
</html>
