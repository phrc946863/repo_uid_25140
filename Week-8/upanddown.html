<!DOCTYPE html>
<html>
<head>
    <title>Bouncing Ball Animation</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .ball {
            width: 80px;
            height: 80px;
            background-color: red;
            border-radius: 50%;
            position: relative;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from {
                top: 0px;
            }
            to {
                top: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="ball"></div>
</body>
</html>
